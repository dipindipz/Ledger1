<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ledger Dashboard</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

h1{
text-align:center;
}

.stats{
display:flex;
justify-content:space-between;
margin-top:15px;
}

.bar{
background:#334155;
height:14px;
border-radius:10px;
margin-top:10px;
}

.fill{
background:#22c55e;
height:14px;
border-radius:10px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

td,th{
padding:12px;
border-bottom:1px solid #334155;
}

.paid{
color:#22c55e;
font-weight:bold;
}

.pending{
color:#ef4444;
}

footer{
text-align:center;
font-size:12px;
margin-top:20px;
color:#94a3b8;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1 id="title">Ledger</h1>

<div class="stats">

<div>
<b>Total</b><br>
₹<span id="total">0</span>
</div>

<div>
<b>Paid</b><br>
₹<span id="paid">0</span>
</div>

<div>
<b>Balance</b><br>
₹<span id="balance">0</span>
</div>

</div>

<div class="bar">
<div class="fill" id="progress"></div>
</div>

<table>

<thead>
<tr>
<th>Member</th>
<th>Status</th>
</tr>
</thead>

<tbody id="list"></tbody>

</table>

</div>

<footer>
Updated via Termux Ledger
</footer>

</div>

<script>

fetch("ledger.json")
.then(res => res.json())
.then(data => {

document.getElementById("title").innerText=data.title

let total=0
let paid=0

let html=""

data.data.forEach(m=>{

total+=m[1]

if(m[2]) paid+=m[1]

let status=m[2]
? "<span class='paid'>✔ PAID</span>"
: "<span class='pending'>⏳ PENDING</span>"

html+=`
<tr>
<td>${m[0]}<br><small>₹${m[1]}</small></td>
<td>${status}</td>
</tr>
`

})

document.getElementById("list").innerHTML=html

document.getElementById("total").innerText=total
document.getElementById("paid").innerText=paid
document.getElementById("balance").innerText=total-paid

let percent=total?Math.floor((paid/total)*100):0

document.getElementById("progress").style.width=percent+"%"

})

</script>

</body>
</html>
